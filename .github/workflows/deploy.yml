name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3" # Updated to match the recommended version
          channel: "stable"

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Get dependencies
        run: flutter pub get

      # Only build once with the environment variables
      - name: Build web with environment variables
        run: flutter build web --release --base-href=/grammar/ --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
